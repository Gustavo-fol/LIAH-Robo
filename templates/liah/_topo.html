<header class="topo">
  <div class="miolo topo-in">
    <a class="marca" href="{% url 'home' %}" aria-label="Liah-Robo, página inicial">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#08101d"/><rect x="8" y="10" width="5" height="11" rx="2.5" fill="#5de1ed"/><rect x="19" y="10" width="5" height="11" rx="2.5" fill="#5de1ed"/></svg>
      <span>Liah</span>
    </a>
    <nav class="menu" aria-label="Principal">
      <a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Início</a>
      <button type="button" class="menu-btn" data-abrir-sobre aria-haspopup="dialog">Sobre a Liah</button>
      {% if user.is_authenticated %}
        <a href="{% url 'painel' %}"{% if request.resolver_match.url_name == 'painel' %} aria-current="page"{% endif %}>Painel</a>
        <a href="{% url 'chat' %}"{% if request.resolver_match.url_name == 'chat' %} aria-current="page"{% endif %}>Conversar</a>
        <a href="{% url 'configuracoes' %}"{% if request.resolver_match.url_name == 'configuracoes' %} aria-current="page"{% endif %}>Configurações</a>
      {% endif %}
    </nav>
    <div class="conta">
      {% if user.is_authenticated %}
        <span class="conta-nome">{{ user.get_username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-fantasma" type="submit">Sair</button></form>
      {% else %}
        <a class="btn btn-sec" href="{% url 'login' %}">Entrar</a>
      {% endif %}
    </div>
  </div>
</header>
