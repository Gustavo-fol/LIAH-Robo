{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS — Acesso Seguro</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'liah/css/login.css' %}">

    <!-- JavaScript -->
    <script src="{% static 'liah/js/login.js' %}" defer></script>
</head>

<body>

    <!-- BACKGROUND LAYER -->
    <div class="bg-canvas">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>

        <div class="mesh-grid"></div>

        <div class="light-streak streak-1"></div>
        <div class="light-streak streak-2"></div>
        <div class="light-streak streak-3"></div>

        <canvas id="particles-canvas"></canvas>
    </div>

    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="noise-overlay"></div>

    <!-- MAIN CONTENT -->
    <main class="main-container">

        <section
            class="login-card"
            id="login-card"
            aria-label="Formulário de login"
        >

            <!-- HEADER -->
            <header class="card-header">

                <div class="brand-icon">
                    <svg viewBox="0 0 48 48" fill="none">

                        <path
                            d="M24 4L6 14v20l18 10 18-10V14L24 4z"
                            stroke="url(#iconGrad)"
                            stroke-width="2"
                        />

                        <path
                            d="M24 4v40M6 14l18 10 18-10M6 34l18-10 18 10"
                            stroke="url(#iconGrad)"
                            stroke-width="1.5"
                            opacity="0.5"
                        />

                        <circle
                            cx="24"
                            cy="24"
                            r="5"
                            fill="url(#iconGrad)"
                            opacity="0.8"
                        />

                        <defs>
                            <linearGradient
                                id="iconGrad"
                                x1="6"
                                y1="4"
                                x2="42"
                                y2="44"
                            >
                                <stop offset="0%" stop-color="#00e5ff"/>
                                <stop offset="100%" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>

                    </svg>
                </div>

                <h1 class="card-title">Bem-vindo de volta</h1>

                <p class="card-subtitle">
                    Entre na sua conta Nexus para continuar
                </p>

            </header>

            <!-- FORM -->
            <form
                class="form-body"
                id="login-form"
                method="POST"
                action="{% url 'login' %}"
                novalidate
                autocomplete="on"
            >

                {% csrf_token %}

                <!-- EMAIL -->
                <div class="input-group" id="email-group">

                    <div class="input-wrapper">

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="2" y="4" width="20" height="16" rx="3"/>
                            <path d="M2 7l10 6 10-6"/>
                        </svg>

                        <input
                            type="email"
                            class="input-field"
                            id="email"
                            name="email"
                            placeholder="E-mail"
                            autocomplete="username"
                            spellcheck="false"
                            required
                        >

                        <label class="floating-label" for="email">
                            E-mail
                        </label>

                    </div>

                    <div class="error-message" id="email-error">

                        <svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2"
                            stroke-linecap="round">

                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>

                        </svg>

                        <span></span>

                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="input-group" id="password-group">

                    <div class="input-wrapper">

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="3" y="11" width="18" height="11" rx="3"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>

                        <input
                            type="password"
                            class="input-field"
                            id="password"
                            name="password"
                            placeholder="Senha"
                            autocomplete="current-password"
                            required
                        >

                        <label class="floating-label" for="password">
                            Senha
                        </label>

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggle-password"
                            aria-label="Mostrar ou ocultar senha"
                        >

                            <svg
                                id="eye-open"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                            <svg
                                id="eye-closed"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                style="display:none;"
                            >
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>

                        </button>

                    </div>

                    <div class="error-message" id="password-error">

                        <svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2"
                            stroke-linecap="round">

                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>

                        </svg>

                        <span></span>

                    </div>

                    <div class="password-strength" id="password-strength">

                        <div class="strength-bar" id="str-1">
                            <div class="fill"></div>
                        </div>

                        <div class="strength-bar" id="str-2">
                            <div class="fill"></div>
                        </div>

                        <div class="strength-bar" id="str-3">
                            <div class="fill"></div>
                        </div>

                        <div class="strength-bar" id="str-4">
                            <div class="fill"></div>
                        </div>

                    </div>

                    <div class="strength-text" id="strength-text"></div>

                </div>

                <!-- META ROW -->
                <div class="meta-row">

                    <label class="checkbox-wrapper">

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                        >

                        <div class="custom-checkbox">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="3"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>

                        </div>

                        <span class="checkbox-label">
                            Lembrar de mim
                        </span>

                    </label>

                    <a href="{% url 'password_reset' %}" class="forgot-link">
                        Esqueceu a senha?
                    </a>

                </div>

                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn"
                    id="login-btn"
                >

                    <span class="btn-content">

                        <span>Entrar</span>

                        <svg
                            class="arrow"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>

                    </span>

                    <div class="btn-spinner">
                        <div class="spinner"></div>
                    </div>

                    <div class="btn-success-icon">

                        <svg
                            class="success-check"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M5 13l4 4L19 7"/>
                        </svg>

                    </div>

                </button>

            </form>

            <!-- DIVIDER -->
            <div class="divider">

                <div class="divider-line"></div>

                <span class="divider-text">ou</span>

                <div class="divider-line"></div>

            </div>

            <!-- SOCIAL LOGIN -->
            <div class="social-row">

                <button
                    type="button"
                    class="social-btn"
                    aria-label="Entrar com Google"
                >
                    <!-- Mantenha aqui o SVG original do Google -->
                </button>

                <button
                    type="button"
                    class="social-btn"
                    aria-label="Entrar com Apple"
                >
                    <!-- Mantenha aqui o SVG original da Apple -->
                </button>

                <button
                    type="button"
                    class="social-btn"
                    aria-label="Entrar com GitHub"
                >
                    <!-- Mantenha aqui o SVG original do GitHub -->
                </button>

            </div>

            <!-- FOOTER -->
            <footer class="card-footer">

                <p>
                    Não possui uma conta?
                    <a href="{% url 'register' %}" class="register-link">
                        Criar conta
                    </a>
                </p>

            </footer>

            <!-- SUCCESS OVERLAY -->
            <div class="success-overlay" id="success-overlay">

                <div class="success-ring">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M5 13l4 4L19 7"/>
                    </svg>

                </div>

                <div class="success-title">
                    Bem-vindo de volta!
                </div>

                <div class="success-subtitle">
                    Redirecionando para o painel...
                </div>

            </div>

        </section>

    </main>

</body>
</html>
